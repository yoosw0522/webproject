<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script>
        let date = new Date();
        let year = date.getFullYear();
        let month = date.getMonth() + 1; // 월은 0부터 시작
        let day = date.getDate();
        let hours = date.getHours();//24시각제
        let minutes = date.getMinutes();
        let seconds = date.getSeconds();

        let meridiem;

        if (hours < 12) {
            meridiem = "오전";
        } else {
            meridiem = "오후";
            hours -= 12; // 오후인 경우 12시간을 빼줌
        }

        alert(year + "년 " + month +" 월 " + day + "일 " + meridiem + " " + hours + "시 " + minutes + "분 " + seconds + "초");
    </script>
</head>
<body>
    
</body>
</html>
