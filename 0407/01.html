<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <form action="01.html" method="get">
        <fieldset>
            <legend>회원가입</legend>
            <table width="300">
                <tr>
                    <td><label for="name">성명:</label></td>
                    <td><input type="text" id="name" name="name"></td>
                </tr>
                <tr>
                    <td><label for="email">이메일:</label></td>
                    <td><input type="email" id="email" name="email"></td>
                </tr>
                <tr>
                    <td><label for="address">주소:</label></td>
                    <td><input type="text" id="address" name="address"></td>
                </tr>
                <tr>
                    <td><label for="gender">성별:</label></td>
                    <td>
                        <input type="radio" id="male" name="gender" value="남성">
                        <label for="male">남성</label>
                        &nbsp;&nbsp;
                        <input type="radio" id="female" name="gender" value="여성">
                        <label for="female">여성</label>
                    </td>
                </tr>
                <tr>
                    <td>취미:</td>
                    <td>
                        <input type="checkbox" name="hobby1" value="독서">독서 &nbsp;&nbsp;
                        <input type="checkbox" name="hobby2" value="음악">음악 &nbsp;&nbsp;
                        <input type="checkbox" name="hobby3" value="스포츠">스포츠
                    </td>
                </tr>
                <tr>
                    <td>취미:</td>
                    <td>
                        <input type="checkbox" name="hobby1" value="독서">독서 &nbsp;&nbsp;
                        <input type="checkbox" name="hobby2" value="음악">음악 &nbsp;&nbsp;
                        <input type="checkbox" name="hobby3" value="스포츠">스포츠
                    </td>
                </tr>
                <tr>
                    <td>남기고 싶은 말</td>
                    <td>
                        <textarea name="message" cols="30" rows="3">기타 하고 싶은
                                        말이 있으면 입력하세요.</
                        </textarea>
                    </td>
                </tr>
                <tr>
                    <td colspan="2" align="center">
                        <input type="submit" value="가입하기">&nbsp;&nbsp;
                        <input type="reset" value="입력초기화">
                    </td>
                </tr>
             </table>
        </fieldset>
    </form>

</body>

</html>
